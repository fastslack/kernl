# ══════════════════════════════════════════════════════════════════════════
#  Kernl — DEFAULT STACK (zero-config)
#
#  A self-contained stack anyone can run from a fresh clone with no host
#  paths and no private sibling repos:
#
#      docker compose up -d --build
#      open http://localhost:3086
#
#  What you get: kernel API + MCP (http://localhost:3086/mcp), the dashboard,
#  Neo4j (graph features), and SearXNG (key-free web search). The Rust bridge
#  (mtw-request) and the WhatsApp bridge live in docker-compose.full.yml
#  (the host-coupled full stack: `docker compose -f docker-compose.full.yml up`)
#  and are intentionally omitted here — the kernel degrades gracefully
#  without them.
#
#  Optional API keys can be supplied via the host environment or an .env
#  file; everything below has safe defaults so the stack boots with
#  literally zero setup.
# ══════════════════════════════════════════════════════════════════════════
name: kernl-public

services:
  # ── mtwRequest (Rust engine: torrents + realtime bridge) ─────
  #
  # OPT-IN via the `torrents` profile, so the zero-config `docker compose up`
  # is unchanged for anyone who does not have this image. Bring it in with:
  #
  #   BRIDGE_ENABLED=true RUST_BRIDGE_ENABLED=true \
  #     docker compose --profile torrents up -d
  #
  # (or set those two in .env and use `--profile torrents` alone)
  #
  # Without it the Torrents extension has no engine: no DHT, no metadata, no
  # byte stream — /api/torrents/capabilities reports backend "legacy" and the
  # player says so instead of waiting on a swarm that can never form.
  #
  # The image is built from the mtwRequest repo; override the namespace with
  # KERNEL_IMAGE_NAMESPACE if yours is tagged differently.
  mtw-request:
    profiles: ["torrents"]
    image: ${KERNEL_IMAGE_NAMESPACE:-fastslack}/mtw-request:latest
    container_name: kernl-public-mtw-request
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # The kernel talks control-plane over this Unix socket (msgpack RPC),
      # shared through the bridge-sock volume below.
      RUST_BRIDGE_SOCKET: /tmp/mtw-rust.sock
      # librqbit's data plane. Defaults to 127.0.0.1, which only this
      # container could reach — the kernel proxies stream bytes over the
      # docker network, so it has to bind 0.0.0.0.
      TORRENT_HTTP_LISTEN: 0.0.0.0:9999
    volumes:
      - ./mtw.docker.toml:/app/mtw.toml:ro
      - bridge-sock:/tmp
      # mtw.toml points its store at /data/kernel.db. The full stack bind-mounts
      # ./data there; here the database lives in the kernel-data volume, so the
      # engine reads the same file the kernel writes. Read-only: the engine is a
      # consumer of that store, not an author.
      - kernel-data:/data:ro

  # ── Kernl API (backend + MCP over HTTP) ─────────
  kernel:
    build:
      context: ./services/kernel
      dockerfile: Dockerfile
    image: localhost/kernl:public
    container_name: kernl-public-kernel
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: http
      # This container has no IPv6 default route, but the resolver still returns
      # AAAA records — so any Cloudflare-fronted host (loc.gov, api.europeana.eu,
      # the YTS RSS feed) intermittently resolved to an address nothing could
      # reach, surfacing as "Unable to connect" or getaddrinfo ESERVFAIL.
      # archive.org is not behind Cloudflare, which is why cinema never hit it.
      NODE_OPTIONS: --dns-result-order=ipv4first
      DASHBOARD_ENABLED: "false"   # nginx (dashboard service) serves the SPA
      DASHBOARD_PORT: "3087"
      SQLITE_PATH: /app/data/kernel.db
      # ── Agent sandbox ──
      # The driver runs in here but the daemon runs out there, so it needs the
      # operator's real home to locate the Claude CLI and credentials to mount;
      # HOME inside this container is /home/bun, which does not exist on the
      # host. KERNEL_DATA_VOLUME lets it mount agent workspaces by volume name
      # instead of by a host path that a named volume simply does not have.
      HOST_HOME: ${HOST_HOME:-/home/fastslack}
      KERNEL_DATA_VOLUME: ${KERNEL_DATA_VOLUME:-kernl-public_kernel-data}
      KERNEL_AGENT_DOCKER_NETWORK: ${KERNEL_AGENT_DOCKER_NETWORK:-kernl-public_default}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: kernlgraph
      SEARXNG_BASE_URL: http://searxng:8080
      TIMEZONE: ${TIMEZONE:-UTC}
      # ── MCP Bridge (external MCP servers) ──
      # JSON array of remote/local MCP servers whose tools get injected into
      # the kernel pipeline as mcp_{name}_{tool}. Documented in .env.example;
      # without this line the var stays on the host and never reaches the
      # kernel, so the bridge always logs "no servers configured".
      MCP_BRIDGE_SERVERS: ${MCP_BRIDGE_SERVERS:-}
      # Rust bridge — OFF by default, so the stack still boots with nothing
      # but the kernel. Turn both on (in .env or inline) together with
      # `--profile torrents` to get the real torrent engine.
      BRIDGE_ENABLED: ${BRIDGE_ENABLED:-false}
      RUST_BRIDGE_ENABLED: ${RUST_BRIDGE_ENABLED:-false}
      # The engine creates the socket at /tmp/mtw-rust.sock inside ITS
      # container; that /tmp is the bridge-sock volume, which this container
      # mounts at /run/mtw. Same file, different path — hence the override.
      # (docker-compose.full.yml shares the whole /tmp instead; here the
      # kernel keeps its own /tmp, which it uses to stage extension uploads.)
      RUST_BRIDGE_SOCKET: /run/mtw/mtw-rust.sock
      # Where the mtwRequest broker lives. Defaults to ws://localhost:7741/ws
      # (see core/bootstrap/mtw.ts), which inside this container is nothing —
      # the engine is a sibling on the compose network.
      KERNEL_URL: ${KERNEL_URL:-ws://mtw-request:7741/ws}
      # Where to fetch torrent bytes from. The engine reports its own listen
      # address as 0.0.0.0:9999, which is meaningless to another container —
      # rust-backend.ts substitutes this host when the reported one is a
      # wildcard or loopback.
      TORRENT_RUST_HTTP_HOST: ${TORRENT_RUST_HTTP_HOST:-mtw-request}
      TORRENT_RUST_HTTP_PORT: ${TORRENT_RUST_HTTP_PORT:-9999}
      # Peering: instance identity + friends. KERNEL_TOR=1 brings up an onion
      # service so this instance is reachable behind NAT, CGNAT or a tethered
      # phone, with no port forwarding and no infrastructure to operate. The
      # onion key lives in the data volume, so the address survives restarts.
      KERNEL_TOR: ${KERNEL_TOR:-0}
      KERNEL_INSTANCE_NAME: ${KERNEL_INSTANCE_NAME:-}
      # KERNEL_AUTH_TOKEN intentionally unset: the kernel generates a random
      # token on first boot and persists it to /app/data/.kernel-auth-token
      # (mode 600) in the kernel-data volume. Read it once and paste it into
      # the dashboard's login screen:
      #   docker compose exec kernel cat /app/data/.kernel-auth-token
      # Pin your own instead with:  KERNEL_AUTH_TOKEN: <openssl rand -hex 32>
      #
      # Do NOT set KERNEL_ALLOW_UNAUTH here. Binding to loopback does not make
      # an open API safe: the API answers any page the user has open in a
      # browser, which is already inside the loopback boundary.
      #
      # In-container the kernel MUST bind 0.0.0.0 or nginx (sibling container)
      # can't proxy to it — port 3087 is never published to the host, so the
      # only external surface remains nginx on host loopback. resolveSecureBind
      # honors an explicit bind because a real auth token is in place.
      KERNEL_DASHBOARD_BIND: 0.0.0.0
      # ── Pro license (owner all-access) ──────────────────────────
      # The license JWT lives in the data volume at $XDG_CONFIG_HOME/kernl/
      # license.jwt so it survives container recreation. KERNEL_LICENSE_ISSUER
      # must match the license's `iss` claim.
      XDG_CONFIG_HOME: /app/data/xdg
      KERNEL_LICENSE_ISSUER: ${KERNEL_LICENSE_ISSUER:-issuer.lifekernl.com}
      # KERNEL_ENCRYPTION_KEY intentionally unset: the kernel auto-generates a
      # random 32-byte key on first boot and persists it to /app/data
      # (.kernel-encryption-key, mode 600) in the kernel-data volume, reusing it
      # across restarts. Override here only if you want to pin a specific key:
      #   KERNEL_ENCRYPTION_KEY: ${KERNEL_ENCRYPTION_KEY:-}
      # Optional LLM keys — leave unset and configure later in Settings → AI.
      # Set any of these in .env next to this file; empty ones are ignored and
      # the provider simply stays out of the chain. Without at least one, every
      # LLM-backed feature (subtitle translation, triage, digests, agents)
      # fails with "no usable output" — the kernel has nothing to call.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_DEFAULT_MODEL: ${MINIMAX_DEFAULT_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      # Local runtimes (LM Studio / Ollama). Point at the host with
      # host.docker.internal, e.g. http://host.docker.internal:1234/v1
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      # A small, cheap model for mechanical subtasks (subtitle translation,
      # extraction). Falls back to the chain default when unset.
      CHAT_EXTRACTION_MODEL: ${CHAT_EXTRACTION_MODEL:-}
      # ── Filesystem Commander scope ──────────────────────────────
      # Without this the local provider falls back to homedir(), which inside
      # this image is /home/bun — the base image's home, holding three dotfiles
      # and nothing the user cares about. Every real path then fails with
      # "Path out of allowed scope".
      #
      # Must match a path that is actually mounted below: declaring a root the
      # container cannot see just moves the failure from "out of scope" to
      # "no such directory".
      FS_COMMANDER_ALLOWED_ROOTS: /home/fastslack/mtwProjects/LABS
    volumes:
      - kernel-data:/app/data
      # The Unix socket mtw-request listens on. Harmless when the engine is
      # not running: the bridge just finds nothing there and stays disabled.
      - bridge-sock:/run/mtw
      # Mounted at its host path so the commander's breadcrumbs match what the
      # user sees in a terminal. Read-only: this API exposes delete and move
      # over HTTP, so write access is a deliberate later step, not a default.
      - /home/fastslack/mtwProjects/LABS:/home/fastslack/mtwProjects/LABS:ro
      # Host identity for the sandbox driver. Every -v it emits is resolved by
      # the daemon on the HOST, so it needs the operator's real home to find
      # the Claude CLI and credentials; inside the container HOME is /home/bun,
      # which does not exist out there.
      #   (declared in `environment:` below, kept here as a pointer)
      # Docker engine socket — this is what lets the agent sandbox drivers run.
      # Without it `SandboxDriverRegistry: start("docker") failed` at boot, the
      # only way to run an agent that touches real files was unsandboxed, and
      # the executor hard-denies that unless the operator opts in. The image
      # already adds `bun` to group 981, which is the host's `docker` group, so
      # the socket is readable without running as root.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      neo4j:
        condition: service_started
      searxng:
        condition: service_started

  # ── Dashboard (self-contained SvelteKit SPA + nginx) ─
  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile.public
    image: localhost/mtw-dashboard:public
    container_name: kernl-public-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3086:80"   # loopback only; the API behind it requires a token
    depends_on:
      - kernel

  # ── SearXNG (key-free meta-search for web-intel) ─────
  searxng:
    image: searxng/searxng:latest
    container_name: kernl-public-searxng
    restart: unless-stopped
    volumes:
      - ./services/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-kernl-public-eval-secret}

  # ── Neo4j (graph intelligence; kernel degrades if absent) ─
  #  Heaviest service. On a ≤2 GB host it may be OOM-killed — that's fine, the
  #  kernel runs without it (graph features just go dark). To run leaner, delete
  #  this service and the `neo4j:` depends_on entry above. Tip: run
  #  `bash scripts/preflight.sh` first to catch port/RAM problems early.
  neo4j:
    image: neo4j:5.22.0
    container_name: kernl-public-neo4j
    restart: unless-stopped
    environment:
      # Neo4j 5.x rejects passwords shorter than 8 characters and exits 70 on
      # startup, which `restart: unless-stopped` turns into a crash loop. Keep
      # this at 8+ chars, and in sync with NEO4J_PASSWORD above and the
      # healthcheck below.
      NEO4J_AUTH: neo4j/kernlgraph
      # Graph Data Science. The image resolves a version compatible with the
      # tag above and downloads it on first boot, so this needs outbound
      # network once; set NEO4J_PLUGINS=[] to run without it (graph analytics
      # go dark, plain Cypher and native vector search are unaffected).
      NEO4J_PLUGINS: '${NEO4J_PLUGINS:-["graph-data-science"]}'
      # Defaults stay small so the quick start fits a modest host. Raise them
      # in .env once the graph holds real volume — GDS projections live in the
      # heap, so analytics on a large graph is what usually needs the room.
      # What the server tells Browser to connect to. Without this it advertises
      # its own internal 7687, which on the host is whatever else is listening
      # there — on a machine running a second Neo4j, Browser silently opens the
      # wrong database. Must match the published bolt port below. Only affects
      # what clients are told; the kernel dials bolt://neo4j:7687 directly.
      NEO4J_server_bolt_advertised__address: localhost:${NEO4J_BOLT_PORT:-17687}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
    # Health shows in `docker compose ps`; the kernel does NOT block on it (it
    # degrades gracefully), so a dead Neo4j never wedges startup.
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p kernlgraph 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    # Neo4j Browser + Bolt, on loopback only. The kernel reaches Neo4j over the
    # compose network and needs none of this; it is here so a human can open the
    # browser and read the graph. Non-default host ports keep it clear of a
    # second Neo4j on the same machine, and 127.0.0.1 keeps the database off the
    # network — the password lives in this file, so it must not be reachable.
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

volumes:
  kernel-data:
  # Carries /tmp/mtw-rust.sock between the engine and the kernel.
  bridge-sock:
  neo4j-data:
  neo4j-logs:
