# Marketing site deploy.
#
# Pushes `site/` to Cloudflare Pages on every push to main that touches
# the site directory. Manual triggers are also allowed for forcing a
# redeploy without a content change (e.g., after rotating an API token).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN     — token with Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID    — your Cloudflare account ID
#
# One-time setup on Cloudflare:
#   1. Create a Pages project named `kernl` (Direct Upload mode)
#   2. Point your custom domain (github.com/fastslack/kernl) at the project
#   3. No build command needed — site/ is already static HTML

name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Avoid stacking deploys if the user pushes a quick string of fixes —
# only the latest commit matters for the live site.
concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write   # Pages action writes a Deployment status

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: site-production
      url: https://github.com/fastslack/kernl
    steps:
      - uses: actions/checkout@v5

      # Render the OG card to PNG so social platforms that reject SVG
      # (X, LinkedIn, Slack) get a proper preview image. rsvg-convert
      # is in librsvg2-bin on Ubuntu runners — fast install, no network.
      - name: Install rsvg-convert
        run: sudo apt-get update -qq && sudo apt-get install -y librsvg2-bin
      - name: Render og.png
        run: rsvg-convert -w 1200 -h 630 site/og.svg -o site/og.png

      # Render the favicon SVG into iOS' apple-touch-icon (180×180 PNG).
      # iOS bookmarks fall back to a generated screenshot otherwise.
      - name: Render apple-touch-icon.png
        run: rsvg-convert -w 180 -h 180 site/favicon.svg -o site/apple-touch-icon.png

      # Keep /install.sh and /install.ps1 in lockstep with the canonical
      # installers in scripts/. They're served by Cloudflare's edge so
      # users get a faster handshake than raw.githubusercontent.
      - name: Sync install scripts into site/
        run: |
          cp scripts/get.sh  site/install.sh
          cp scripts/get.ps1 site/install.ps1
          chmod +x site/install.sh

      # Publish SHA-256 hashes alongside the installers so security-
      # conscious users can verify the script before piping it to a shell.
      # The /install page links to /install.sh.sha256 and /install.ps1.sha256.
      - name: Generate install-script checksums
        run: |
          (cd site && sha256sum install.sh  > install.sh.sha256)
          (cd site && sha256sum install.ps1 > install.ps1.sha256)

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Adjust `--project-name` to match the Pages project you created.
          # `--branch main` makes this the production deploy; preview
          # branches go up automatically on PRs if you want them.
          command: pages deploy site --project-name=kernl --branch=main
