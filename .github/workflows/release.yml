# Cross-platform release builder for Kernl.
#
# Triggered by:
#   - push of a tag matching v*.*.*           → full release
#   - manual workflow_dispatch                → build artifacts only, no release
#
# What it produces:
#   linux-x64       kernl-<v>.rpm                   sudo dnf install
#                   kernl_<v>_amd64.deb             sudo apt install
#   darwin-arm64    Kernl-<v>-arm64.dmg             drag to /Applications
#                   Kernl-<v>-arm64-macos.tar.gz    portable
#   darwin-x64      Kernl-<v>-x64.dmg               (Intel Macs)
#   win-x64         kernl-<v>-windows-x64.msi       msiexec / installer
#                   kernl-<v>-windows-x64.zip       portable
#
# Note the casing: macOS artifacts are "Kernl-*", linux and windows ones are
# "kernl-*". That is what the packagers actually emit, and the publish job
# runs on Linux where the distinction is load-bearing.
#
# All artifacts use the same `packaging/stage-payload.sh` pipeline. Native
# modules are installed fresh on each runner so prebuilds match the host.
# Code signing is opt-in via secrets (see "Signing" section below).

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Without this the GITHUB_TOKEN is read-only, and the whole thing fails at the
# last step: every platform builds, every artifact is produced, and attaching
# them to the release dies with "Resource not accessible by integration". That
# is what happened to v0.2.0 — five green jobs and a release with nothing in
# it, which reads as a successful release until someone tries to install it.
permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  # ── Guard: the tag must match the version the packages are built from ──
  # install.sh resolves assets by exact filename, deriving the version from the
  # release TAG, while every packager derives it from services/kernel/
  # package.json. If those drift, the build is green, the release publishes,
  # and every native install path 404s — the failure lands on users, not here.
  # Fail loudly instead, before anything is built.
  version-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches package.json
        run: |
          PKG="$(node -p "require('./services/kernel/package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG"
          echo "tag:          $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG."
            echo "::error::Packages would be named kernl-$PKG-* while install.sh looks for kernl-$TAG-*."
            echo "::error::Bump services/kernel/package.json to $TAG, or tag v$PKG."
            exit 1
          fi

  # ── Linux: RPM + DEB (Ubuntu runner) ────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}" }

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zstd
          npm ci --no-audit --no-fund --prefix services/kernel

      - name: Build kernel + dashboard
        run: |
          # Dashboard FIRST. `npm run build` in services/kernel ends in
          # build-extensions, which compiles each extension page with the
          # dashboard's toolchain — and when services/dashboard/node_modules
          # is absent it skips every frontend bundle, warns, and exits 0.
          # Built in the other order this job produced .deb and .rpm packages
          # with no extension pages at all, and the release went green.
          # The macOS and Windows jobs already order it this way.
          (cd services/dashboard && npm ci --no-audit --no-fund && npm run build)
          (cd services/kernel && npm run build)

      - name: Build RPM
        run: PLATFORM=linux-x64 packaging/rpm/build-rpm.sh
      - name: Build DEB
        run: PLATFORM=linux-x64 packaging/deb/build-deb.sh

      # Portable tarball — what in-app update downloads on Linux.
      #
      # .deb and .rpm cannot serve that purpose: their files belong to dpkg or
      # rpm, and replacing them from inside the app leaves a machine whose next
      # `apt upgrade` reverts the update. So a package install is told to use
      # its package manager, and everyone else gets this. Without it the
      # feature could not work on Linux no matter what the code did — there was
      # nothing self-contained to download.
      - name: Build portable tarball
        id: tarball
        run: |
          VERSION=$(node -p "require('./services/kernel/package.json').version")
          STAGE=$(mktemp -d)
          STAGE_DIR="$STAGE" PLATFORM=linux-x64 packaging/stage-payload.sh
          mkdir -p packaging/out
          OUT="packaging/out/Kernl-${VERSION}-x64-linux.tar.gz"
          # One top-level directory inside, which is what the updater expects
          # to find when it unpacks.
          tar -czf "$OUT" -C "$STAGE" "kernl-${VERSION}"
          echo "path=$OUT" >> $GITHUB_OUTPUT

      - name: Locate artifacts
        id: locate
        run: |
          RPM=$(find ~/rpmbuild/RPMS/x86_64 -name "*.rpm")
          DEB=$(find packaging/out -name "kernl_*.deb")
          echo "rpm=$RPM" >> $GITHUB_OUTPUT
          echo "deb=$DEB" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            ${{ steps.locate.outputs.rpm }}
            ${{ steps.locate.outputs.deb }}
            ${{ steps.tarball.outputs.path }}

  # ── macOS: .app → .dmg, both archs (macOS runners) ─────────────
  macos:
    strategy:
      matrix:
        include:
          # macos-13 was retired and macos-14 is deprecated: a job asking for a
          # retired label is not rejected, it queues until it expires — which is
          # exactly how the x64 build silently never ran. Both pinned to the
          # current GA image instead.
          - arch: arm64
            runner: macos-15
            platform: darwin-arm64
          - arch: x64
            runner: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    # Signing secrets are mapped at the JOB level on purpose. A step's `if:` is
    # evaluated before that step's own `env:` block exists, so the previous
    # `if: env.APPLE_CERT_DATA != ''` next to `env: APPLE_CERT_DATA: ${{ ... }}`
    # was always false — signing and notarization silently never ran, and the
    # release still succeeded with unsigned artifacts. Job-level env IS in
    # scope for step conditions. (`secrets` itself is not available in a
    # step-level `if`, which is why the mapping exists at all.)
    env:
      APPLE_CERT_DATA: ${{ secrets.APPLE_CERT_DATA }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}" }

      - name: Install npm deps
        run: |
          npm ci --no-audit --no-fund --prefix services/kernel
          (cd services/dashboard && npm ci --no-audit --no-fund && npm run build)

      - name: Build kernel
        run: (cd services/kernel && npm run build)

      - name: Build .app bundle
        run: PLATFORM=${{ matrix.platform }} packaging/macos/build-app.sh

      # ── Sign + notarize (opt-in via secrets) ─────────────────────
      # Without these secrets the .app is unsigned. Users right-click → Open
      # to bypass Gatekeeper. With them, we get a Developer ID-signed and
      # Apple-notarized bundle that opens with a normal double-click.
      #
      # Every step below gates on APPLE_CERT_DATA, not on three different
      # secrets. Separate gates meant a half-filled secret set produced a
      # signed-but-unnotarized build — which Gatekeeper rejects exactly like an
      # unsigned one — and the release still went green. The guard turns that
      # into a failure at the top of the job instead.
      - name: Check signing secrets are all-or-nothing
        run: |
          ALL="APPLE_CERT_DATA APPLE_CERT_PASSWORD APPLE_TEAM_ID
               APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY"
          MISSING=""
          COUNT=0
          for v in $ALL; do
            COUNT=$((COUNT + 1))
            [ -z "${!v:-}" ] && MISSING="$MISSING $v"
          done
          SET=$((COUNT - $(echo $MISSING | wc -w)))
          if [ "$SET" -eq "$COUNT" ]; then
            echo "signing: all six secrets present — signed + notarized build"
          elif [ "$SET" -eq 0 ]; then
            echo "signing: no secrets set — UNSIGNED build (users must right-click → Open)"
          else
            echo "::error::Signing secrets are partially set. Missing:$MISSING" >&2
            echo "Set all six or none: a signed-but-unnotarized app is rejected by" >&2
            echo "Gatekeeper the same as an unsigned one, and this job would have" >&2
            echo "shipped it as a successful release." >&2
            exit 1
          fi

      - name: Import signing certificate
        if: env.APPLE_CERT_DATA != ''
        run: |
          echo "$APPLE_CERT_DATA" | base64 --decode > cert.p12
          security create-keychain -p '' build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p '' build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k '' build.keychain
          rm cert.p12

      # Signed inside-out: every nested Mach-O first, the bundle last.
      #
      # This used to be one `codesign --deep`, with the identity written as
      # "Developer ID Application: $APPLE_TEAM_ID". Two bugs in one line.
      # codesign matches the identity as a substring of the certificate's
      # common name, and that name is "Developer ID Application: <Your Name>
      # (TEAMID)" — the team id is in parentheses at the END, so the string
      # never matched and the step died with "no identity found". And Apple
      # deprecated --deep for signing years ago: it does not apply entitlements
      # to nested code, which for a payload that ships its own bun, ffmpeg and
      # whisper binaries means the JIT entitlements never reach the binary that
      # needs them. The keychain holds exactly one Developer ID at this point,
      # so the identity below is unambiguous.
      - name: Sign .app
        if: env.APPLE_CERT_DATA != ''
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./services/kernel/package.json').version")
          APP="packaging/out/Kernl-${VERSION}-${{ matrix.arch }}.app"
          ENT="packaging/macos/entitlements.plist"

          # --timestamp is not optional: notarization rejects a signature with
          # no secure timestamp, and the failure arrives minutes later from
          # Apple's service rather than here.
          sign() {
            codesign --force --options runtime --timestamp \
              --entitlements "$ENT" --sign "Developer ID Application" "$1"
          }

          # Nested code first. `find -perm +111` alone catches shell scripts
          # too, and codesign on a script is a no-op that still costs a call —
          # `file` narrows it to actual Mach-O images (binaries, .dylib, .node).
          find "$APP/Contents" -type f \( -perm +111 -o -name '*.dylib' -o -name '*.node' \) \
            | sort -u \
            | while IFS= read -r f; do
                if file -b "$f" | grep -q '^Mach-O'; then
                  echo "  sign $f"
                  sign "$f"
                fi
              done

          # The bundle last, so its seal covers the signatures written above.
          sign "$APP"

          # --deep IS right for verification: here it means "walk everything
          # and check it", which is exactly the question being asked.
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "── entitlements as signed ──"
          codesign --display --entitlements - "$APP"

      # Notarize the .app itself and staple the ticket INTO the bundle, before
      # it is ever copied into the .dmg.
      #
      # Stapling only the dmg (what this job used to do) leaves the app the
      # user drags to /Applications with no ticket of its own: Gatekeeper then
      # has to ask Apple over the network on first launch, so the app fails to
      # open offline — on a laptop, at a conference, in front of people. The
      # dmg gets its own ticket further down; both is correct, either alone is
      # not.
      - name: Notarize + staple .app
        if: env.APPLE_CERT_DATA != ''
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./services/kernel/package.json').version")
          APP="packaging/out/Kernl-${VERSION}-${{ matrix.arch }}.app"

          echo "$APPLE_API_KEY" > AuthKey.p8
          trap 'rm -f AuthKey.p8 notarize-app.zip' EXIT

          # notarytool takes a zip/dmg/pkg, never a bare .app — and it has to
          # be `ditto -k --keepParent`, the only zip that preserves the bundle's
          # symlinks and extended attributes. A plain `zip -r` uploads an
          # archive whose signature no longer verifies.
          ditto -c -k --keepParent "$APP" notarize-app.zip
          xcrun notarytool submit notarize-app.zip \
            --key AuthKey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Build .dmg
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./services/kernel/package.json').version")
          APP="packaging/out/Kernl-${VERSION}-${{ matrix.arch }}.app"
          DMG="packaging/out/Kernl-${VERSION}-${{ matrix.arch }}.dmg"

          # The bundle goes into the image as plain `Kernl.app`, not under its
          # versioned build name. The user drags whatever is in the window, so
          # the name in here is the name that ends up in /Applications: with
          # the version baked in, every upgrade installs a SECOND copy beside
          # the old one, and the extensions layer — which links the payload's
          # node_modules by absolute path — is left pointing at the previous
          # version's directory (see ensure-packages.ts). Renaming a signed
          # bundle is safe: the signature covers its contents, not the name of
          # the directory holding them.
          rm -rf packaging/dmg-stage
          mkdir -p packaging/dmg-stage
          # ditto, not cp: it is the copy that preserves a bundle's extended
          # attributes and ACLs intact, which is what keeps the signature
          # applied in the previous step verifiable.
          ditto "$APP" packaging/dmg-stage/Kernl.app

          # HiDPI background: one .tiff carrying the 1x and 2x PNGs. Without
          # this the Retina Mac everyone actually owns scales the 1x up and
          # the window looks soft.
          tiffutil -cathidpicheck \
            packaging/macos/dmg-background.png \
            packaging/macos/dmg-background@2x.png \
            -out packaging/dmg-stage/background.tiff

          # dmgbuild writes the window's .DS_Store directly instead of driving
          # Finder over AppleScript, which is what makes this work on a runner
          # with no GUI session. See packaging/macos/dmg-settings.py.
          #
          # Into a venv on purpose. The runner's python3 is Homebrew's, which
          # is an externally-managed environment: a plain `pip install` there
          # fails outright under PEP 668, and `--break-system-packages` is the
          # wrong answer for a tool used once.
          python3 -m venv /tmp/dmgvenv
          /tmp/dmgvenv/bin/pip install --quiet --disable-pip-version-check dmgbuild
          /tmp/dmgvenv/bin/dmgbuild \
            -s packaging/macos/dmg-settings.py \
            -D app="$PWD/packaging/dmg-stage/Kernl.app" \
            -D background="$PWD/packaging/dmg-stage/background.tiff" \
            -D badge_icon="$PWD/packaging/icons/kernl.icns" \
            "Kernl" "$DMG"

          # A .dmg that mounts to a window with two icons in it, or the build
          # failed in a way that still produced a file. Mount it and look.
          MNT="$(mktemp -d)"
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly
          ls -la "$MNT"
          test -d "$MNT/Kernl.app"     || { echo "FAIL: no Kernl.app in the image" >&2; exit 1; }
          test -L "$MNT/Applications"  || { echo "FAIL: no Applications symlink — nothing to drag onto" >&2; exit 1; }
          test -f "$MNT/.DS_Store"     || { echo "FAIL: no .DS_Store — the window will open unstyled" >&2; exit 1; }
          hdiutil detach "$MNT"

      # The disk image gets its own signature and ticket. The app inside it is
      # already signed and stapled by the steps above; this covers the wrapper
      # the user actually downloads.
      - name: Sign + notarize .dmg
        if: env.APPLE_CERT_DATA != ''
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./services/kernel/package.json').version")
          DMG="packaging/out/Kernl-${VERSION}-${{ matrix.arch }}.dmg"

          echo "$APPLE_API_KEY" > AuthKey.p8
          trap 'rm -f AuthKey.p8' EXIT

          # dmgbuild writes an unsigned image. Signing it is what lets
          # Gatekeeper name the developer in the "downloaded from the internet"
          # dialog instead of shrugging.
          codesign --force --timestamp --sign "Developer ID Application" "$DMG"

          xcrun notarytool submit "$DMG" \
            --key AuthKey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      # Repack the portable tarball from the SIGNED bundle.
      #
      # build-app.sh writes both the .app and the .tar.gz, and it runs before
      # any of the signing above — so with every secret correctly configured
      # the dmg shipped signed and notarized while the tarball beside it, same
      # version, same release page, shipped the unsigned bundle. Whoever chose
      # "portable" got the worse artifact for no stated reason.
      #
      # tar, not ditto, and deliberately: the artifact has to stay a .tar.gz
      # with the same shape build-app.sh produced, and macOS bsdtar carries the
      # extended attributes the signature and the stapled ticket live in. That
      # is an assumption, not a guarantee, which is why the step below unpacks
      # what it just wrote and verifies both rather than trusting it.
      - name: Repack portable tarball from the signed app
        if: env.APPLE_CERT_DATA != ''
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./services/kernel/package.json').version")
          APP="packaging/out/Kernl-${VERSION}-${{ matrix.arch }}.app"
          TARBALL="packaging/out/Kernl-${VERSION}-${{ matrix.arch }}-macos.tar.gz"

          # Same command and same archive shape as build-app.sh line 251 — the
          # .app sits at the root of the tar, so `tar xzf` still puts a bundle
          # in the current directory and the README instructions hold. Only the
          # contents differ: this one is signed.
          rm -f "$TARBALL"
          ( cd packaging/out && tar czf "$(basename "$TARBALL")" "$(basename "$APP")" )

          # Prove it: unpack what is about to be uploaded and check both the
          # signature and the ticket survived the round trip. If tar drops the
          # extended attributes the ticket lives in, this fails HERE — loudly,
          # in CI — instead of on a user's laptop with no network.
          rm -rf packaging/tar-verify && mkdir -p packaging/tar-verify
          tar xzf "$TARBALL" -C packaging/tar-verify
          codesign --verify --deep --strict "packaging/tar-verify/$(basename "$APP")"
          xcrun stapler validate "packaging/tar-verify/$(basename "$APP")"
          rm -rf packaging/tar-verify

      - uses: actions/upload-artifact@v7
        with:
          name: darwin-${{ matrix.arch }}
          path: |
            packaging/out/Kernl-*-${{ matrix.arch }}.dmg
            packaging/out/Kernl-*-${{ matrix.arch }}-macos.tar.gz

  # ── Windows: .zip portable + .msi installer ─────────────────────
  windows:
    runs-on: windows-latest
    # Job-level, so the signing step's `if:` can actually see it — see the note
    # on the macos job.
    env:
      WINDOWS_CERT_DATA: ${{ secrets.WINDOWS_CERT_DATA }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}" }

      - name: Install npm deps
        shell: bash
        run: |
          npm ci --no-audit --no-fund --prefix services/kernel
          (cd services/dashboard && npm ci --no-audit --no-fund && npm run build)

      - name: Build kernel
        run: (cd services/kernel && npm run build)

      - name: Build portable zip
        shell: bash
        run: PLATFORM=win-x64 packaging/windows/build-zip.sh

      - name: Install WiX
        run: |
          choco install wixtoolset --no-progress --yes
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH

      - name: Build MSI
        shell: bash
        run: PLATFORM=win-x64 packaging/windows/build-msi.sh

      # ── Smoke-test the MSI on the runner ────────────────────────
      # Building an installer proves nothing about whether it installs. The
      # Linux packages were green for four builds while every one of them
      # served a 500 at / because the kernel could not find the dashboard in
      # the packaged layout — an error no build step can catch. This installs
      # the artifact for real and asks the running server for a page.
      #
      # Note this cannot see the SmartScreen prompt: /quiet bypasses it. That
      # part of the experience still needs a human on a real desktop.
      - name: Install the MSI and check it serves
        shell: pwsh
        run: |
          $msi = (Get-ChildItem packaging/out/*.msi | Select-Object -First 1).FullName
          Write-Host "Installing $msi"
          $p = Start-Process msiexec.exe -Wait -PassThru `
                 -ArgumentList "/i","`"$msi`"","/quiet","/norestart","/l*v","$PWD\msi-install.log"
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::msiexec exited $($p.ExitCode)"
            Get-Content msi-install.log -Tail 40
            exit 1
          }

          $dir = "C:\Program Files\Kernl"
          foreach ($f in @("bun.exe","mcp-server.js","start.bat","dashboard\index.html")) {
            if (-not (Test-Path (Join-Path $dir $f))) {
              Write-Host "::error::missing after install: $f"
              exit 1
            }
            Write-Host "  present: $f"
          }

          # Launch through start.bat, which is what the Start Menu shortcut
          # runs. It is not a wrapper around "bun.exe mcp-server.js": it
          # creates %LOCALAPPDATA%\Kernl, seeds and then sources the user's
          # .env, and chdirs into the data directory before starting the
          # kernel. Invoking bun directly tests a path no user takes.
          $log = "$PWD\kernl-run.log"
          Start-Process cmd.exe -ArgumentList "/c", "`"`"$dir\start.bat`" > `"$log`" 2>&1`"" `
            -WindowStyle Hidden

          # /api/health is the readiness probe start.bat itself waits on, so
          # it is the product's own definition of "up". Keep the two the same:
          # this job passed for months against /api/manifest while start.bat
          # could never get past it, because the workaround below hid the 401
          # here and there is no equivalent for `curl -sf` over there.
          # 5 minutes. The first boot seeds agents, offices and drivers and
          # loads an ONNX embedding model, none of which is instant on a cold
          # runner — and a timeout that fires early is indistinguishable from
          # a hang, which is the thing being diagnosed.
          # -SkipHttpErrorCheck matters here. Without it Invoke-WebRequest
          # throws on any 4xx, and start.bat does not pass KERNEL_ALLOW_UNAUTH:
          # the kernel mints its own token and answers 401. A 401 means the
          # server is up and talking — treating it as "not ready" polled a
          # perfectly healthy server 150 times and then called it a hang.
          $ready = $false
          foreach ($i in 1..150) {
            try {
              $probe = Invoke-WebRequest -Uri "http://127.0.0.1:3086/api/health" `
                         -UseBasicParsing -TimeoutSec 5 -SkipHttpErrorCheck
              if ($probe.StatusCode -gt 0) {
                Write-Host "kernel answered $($probe.StatusCode) on /api/health"
                $ready = $true; break
              }
            } catch { Start-Sleep -Seconds 2 }
          }

          if (-not $ready) {
            Write-Host "::error::kernel never became ready on :3086"

            # Hung or dead? The log ending mid-boot looks identical either way,
            # so ask the OS whether anything is still running before reading it.
            $procs = Get-Process -Name "bun" -ErrorAction SilentlyContinue
            if ($procs) {
              Write-Host "bun.exe is STILL RUNNING (pid $($procs.Id -join ',')) — it hung rather than crashed"
            } else {
              Write-Host "no bun.exe process alive — it exited during boot"
            }
            Write-Host "listening sockets on 3086:"
            netstat -ano | Select-String ":3086" | ForEach-Object { Write-Host "  $_" }

            if (Test-Path $log) {
              Write-Host "---- kernel log (full) ----"
              Get-Content $log
            } else {
              Write-Host "(no log was produced — start.bat did not run)"
            }
            exit 1
          }
          Write-Host "kernel is up"

          # The dashboard itself. A 200 here is the whole point: the Linux
          # packages answered on the API while serving 500 at / for four
          # builds, because the SPA was not where the server looked for it.
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:3086/" `
                 -UseBasicParsing -TimeoutSec 15 -SkipHttpErrorCheck
          $code = $r.StatusCode
          Write-Host "GET / -> $code"

          # 200 is the SPA (the login page is part of it — auth is on, since
          # start.bat does not disable it). 500 is the failure this step exists
          # to catch: the server running while the dashboard files are not
          # where it looks for them.
          if ($code -ne 200) {
            Write-Host "::error::dashboard returned $code at / (expected 200)"
            if ($code -eq 500) {
              Write-Host "500 means the SPA was not found in the packaged layout."
              Write-Host "Contents of the install directory:"
              Get-ChildItem $dir | ForEach-Object { Write-Host "  $($_.Name)" }
            }
            if (Test-Path $log) { Write-Host "---- kernel log ----"; Get-Content $log -Tail 40 }
            exit 1
          }
          Write-Host "dashboard served the SPA"

          # "It answers 200" is not the same as "it works". A native install
          # once served a perfectly good dashboard whose menu had one entry,
          # because the bundled catalog root fell back to cwd — the user's data
          # directory — and 71 modules went undiscovered. Every check passed:
          # installed, started, 200. Empty, but green.
          if (Select-String -Path $log -Pattern "assets/ not found from any known location" -Quiet) {
            Write-Host "::error::the kernel could not locate assets/ — the module catalog will be empty"
            Get-Content $log | Select-String -Pattern "assets/ not found" -Context 0,2
            exit 1
          }
          Write-Host "bundled catalog root resolved"

      # ── Sign (opt-in via secrets) ───────────────────────────────
      - name: Sign artifacts
        if: env.WINDOWS_CERT_DATA != ''
        shell: bash
        run: |
          echo "$WINDOWS_CERT_DATA" | base64 --decode > cert.pfx
          for f in packaging/out/*.msi; do
            signtool.exe sign /f cert.pfx /p "$WINDOWS_CERT_PASSWORD" \
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 "$f"
          done
          rm cert.pfx

      - uses: actions/upload-artifact@v7
        with:
          name: win-x64
          # Lowercase: build-zip.sh / build-msi.sh name these from $NAME, which
          # is "kernl". The capitalised pattern only ever matched because the
          # Windows filesystem ignores case — the publish job below runs on
          # Linux, where it silently matches nothing.
          path: |
            packaging/out/kernl-*-windows-x64.zip
            packaging/out/kernl-*-windows-x64.msi

  # ── Publish: assemble GitHub Release from all artifacts ─────────
  release:
    # version-check is included so a mismatched tag blocks publication rather
    # than merely turning the run red beside a release that already shipped.
    # On workflow_dispatch it is skipped, but so is this job (see `if` below),
    # so nothing is held up.
    needs: [version-check, linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten artifact tree
        run: find artifacts -type f -exec mv -t . {} +

      # Checksums for everything published.
      #
      # The in-app updater downloads a replacement bundle and swaps the running
      # app for it. Until now it verified nothing — it fetched over HTTPS from
      # GitHub and trusted whatever came back. That is a worse gap than the
      # missing code signature: the user already consented once, and a
      # compromised release or an intercepting proxy would be installed without
      # a word. install.sh had the same hole.
      #
      # Generated here rather than per-platform so one file covers every
      # artifact, and so the sums are computed from exactly what gets attached.
      - name: Generate SHA256SUMS
        run: |
          sha256sum \
            kernl-*.rpm kernl_*.deb \
            Kernl-*.dmg Kernl-*-macos.tar.gz \
            kernl-*-windows-x64.msi kernl-*-windows-x64.zip \
            > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          # Case matters here: this job runs on Linux. macOS artifacts are
          # built as "Kernl-*" (APP_NAME) while linux and windows ones use
          # "kernl-*" ($NAME). Both spellings are deliberate, not a typo.
          files: |
            kernl-*.rpm
            kernl_*.deb
            Kernl-*.dmg
            Kernl-*-macos.tar.gz
            kernl-*-windows-x64.msi
            kernl-*-windows-x64.zip
            SHA256SUMS
          generate_release_notes: true
          # Any tag carrying a prerelease suffix (v0.1.1-rc.1, -beta.2 …) is
          # published as a prerelease. This is what keeps `install.sh` honest:
          # it resolves through the API's /releases/latest, which excludes
          # prereleases — so an RC never gets served to someone who just ran
          # the one-liner expecting a stable build.
          prerelease: ${{ contains(github.ref_name, '-') }}
