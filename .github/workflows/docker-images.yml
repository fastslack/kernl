# Build and publish multi-arch container images (linux/amd64 + linux/arm64).
#
# Why: ~half of the Hacker News / self-hosting audience is on Apple Silicon.
# Shipping amd64-only images means their `docker compose up` pulls an emulated
# (or missing) image and the first impression is "doesn't run". This publishes
# both the kernel and the public dashboard image to GHCR for both arches.
#
# Triggers: version tags (release), manual dispatch, and main (for an :edge tag).
# Auth: GITHUB_TOKEN with packages:write — no extra secrets needed for GHCR.
name: docker-images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kernl
            context: ./services/kernel
            dockerfile: services/kernel/Dockerfile
          - name: mtw-dashboard
            context: ./services/dashboard
            dockerfile: services/dashboard/Dockerfile.public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
