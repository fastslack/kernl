# ══════════════════════════════════════════════════════════════════════════
#  Kernl — OPTIONAL Neo4j server
#
#  Kernl's graph is built in: the kernel runs Relate, an embedded Cypher
#  engine, on a file next to its SQLite database. Nothing here is needed for
#  graph features, the chat's memory graph or the agents' shared experience.
#
#  Add this file when you want a Neo4j server instead — for Graph Data
#  Science (the trading and graph-intel analytics run PageRank, Louvain,
#  FastRP… on it), or to keep using the graph of an install that predates the
#  built-in one:
#
#      docker compose -f docker-compose.yml -f docker-compose.neo4j.yml up -d
#
#  scripts/kernl.sh adds it on its own when the `neo4j-data` volume already
#  exists, so an upgraded install keeps its graph. Then pick "Neo4j" in
#  /extensions — or move the graph into the built-in store with
#  scripts/relate-migrate.sh and drop this file.
# ══════════════════════════════════════════════════════════════════════════
name: kernl-public

services:
  kernel:
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: kernlgraph
    volumes:
      # Neo4j's data, read-only: System › Storage measures the graph on disk to
      # enforce its size ceiling (modules/storage/graph.ts, NEO4J_DATA_DIR).
      - neo4j-data:/neo4j-data:ro
    depends_on:
      neo4j:
        condition: service_started

  neo4j:
    image: neo4j:5.22.0
    container_name: kernl-public-neo4j
    restart: unless-stopped
    environment:
      # Neo4j 5.x rejects passwords shorter than 8 characters and exits 70 on
      # startup, which `restart: unless-stopped` turns into a crash loop. Keep
      # this at 8+ chars, and in sync with NEO4J_PASSWORD above and the
      # healthcheck below.
      NEO4J_AUTH: neo4j/kernlgraph
      # Graph Data Science. The image resolves a version compatible with the
      # tag above and downloads it on first boot, so this needs outbound
      # network once; set NEO4J_PLUGINS=[] to run without it.
      NEO4J_PLUGINS: '${NEO4J_PLUGINS:-["graph-data-science"]}'
      # What the server tells Browser to connect to. Without this it advertises
      # its own internal 7687, which on the host is whatever else is listening
      # there. Must match the published bolt port below.
      NEO4J_server_bolt_advertised__address: localhost:${NEO4J_BOLT_PORT:-17687}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p kernlgraph 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    # Neo4j Browser + Bolt, on loopback only — the password lives in this file.
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

volumes:
  neo4j-data:
  neo4j-logs:
