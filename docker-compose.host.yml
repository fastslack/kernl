# Host folders for the kernel. Opt-in, never loaded by default:
#
#   docker compose -f docker-compose.yml -f docker-compose.host.yml up -d kernel
#
# (add -f docker-compose.gpu.yml as well when you use that one; the order of
# the two overlays does not matter). Once applied, every later `compose`
# command for the stack has to name the same files, or the next recreate
# drops these mounts.
#
# It lives apart from docker-compose.yml because these mounts reach into the
# host: a default stack mounting a fixed home folder would make Docker create
# that path as root on a machine that does not have it, and a missing
# ~/.claude.json would come back as an empty directory.
#
# ── Variables (in .env next to this file) ──────────────────────────────────
# KERNL_FS_ROOT  required. The host folder the Filesystem Commander browses,
#                mounted read-only at the same path so its breadcrumbs match
#                what you see in a terminal.
# HOST_HOME      optional, defaults to your $HOME. Where ~/.claude and
#                ~/.claude.json are; both must exist (run `claude` once).
# KERNL_PROJECTS_ROOT
#                optional. The host folder holding the repos your offices work
#                on, mounted READ-WRITE at the same path. An office or agent
#                pointed at a repo outside every mount runs somewhere else and
#                its writes never reach the repo; the kernel refuses such paths
#                and notifies about existing ones. It may contain KERNL_FS_ROOT:
#                that folder stays read-only (the more specific mount wins).
# KERNL_REPO_PATH
#                optional. The kernl repo itself, for the Kernl fixer (the
#                "Que lo arregle Claude Code" button in the chief's office).
#                Only its .git is mounted writable: the working tree stays as
#                read-only as KERNL_FS_ROOT makes it, so a fix can never touch
#                what other sessions have uncommitted. Fixes live as git
#                worktrees under KERNL_FIX_ROOT, each on its own fix/ branch.
# KERNL_REPO_GIT required with KERNL_REPO_PATH: its .git, written in .env as
#                KERNL_REPO_GIT=${KERNL_REPO_PATH}/.git (compose has no
#                "if set, append" interpolation).
# KERNL_FIX_ROOT optional. Where those worktrees go. Must be inside
#                KERNL_PROJECTS_ROOT (writable) and outside KERNL_FS_ROOT.
#
# ── Claude login relay ─────────────────────────────────────────────────────
# "Connect with my subscription" sends the browser back to localhost:<port> on
# THIS machine, while the CLI waiting for it listens inside the container: in
# a plain Docker stack the user has to paste that dead address into the
# dashboard. claude-login-relay listens on that port on the host (it runs with
# the host's network) and hands the redirect to the kernel itself. It needs
# Linux: on Docker Desktop the host network is a VM's, not the browser's. The
# paste keeps working with or without it.

services:
  kernel:
    environment:
      # Where the kernel leaves the CLI's approval link while a sign-in waits,
      # on the data volume the relay below reads.
      KERNL_CLAUDE_LOGIN_DIR: /app/data/claude-login
      FS_COMMANDER_ALLOWED_ROOTS: ${KERNL_FS_ROOT:?set KERNL_FS_ROOT in .env to the folder the Filesystem Commander may browse}
      KERNL_REPO_PATH: ${KERNL_REPO_PATH:-}
      KERNL_FIX_ROOT: ${KERNL_FIX_ROOT:-}
    volumes:
      # Read-only: the commander exposes delete and move over HTTP, so write
      # access is a deliberate later step, not a default.
      - ${KERNL_FS_ROOT}:${KERNL_FS_ROOT}:ro
      # Read-write: offices edit, build and run code here. Unset, it binds
      # /dev/null onto itself — compose has no optional volumes, and that is
      # the one bind that exists everywhere and changes nothing.
      - ${KERNL_PROJECTS_ROOT:-/dev/null}:${KERNL_PROJECTS_ROOT:-/dev/null}
      # Writable .git of the kernl repo, nothing else of it (see KERNL_REPO_PATH).
      # Unset, /dev/null lands on a path nothing reads.
      - ${KERNL_REPO_GIT:-/dev/null}:${KERNL_REPO_GIT:-/run/kernl-repo-unset}
      # The operator's Claude Code login. claude_code agents run the CLI with
      # HOME=$HOST_HOME and read their OAuth session from here; without these
      # two mounts every claude_code run fails "OAuth session expired and could
      # not be refreshed". Read-write, and shared with the host on purpose: the
      # CLI rotates the refresh token, so host and container must write back to
      # the same file or each refresh invalidates the other's session.
      - ${HOST_HOME:-${HOME}}/.claude:${HOST_HOME:-${HOME}}/.claude
      - ${HOST_HOME:-${HOME}}/.claude.json:${HOST_HOME:-${HOME}}/.claude.json

  claude-login-relay:
    image: oven/bun:1
    container_name: kernl-public-claude-login-relay
    network_mode: host
    restart: unless-stopped
    environment:
      KERNL_CLAUDE_LOGIN_DIR: /kernl-data/claude-login
      KERNL_TOKEN_FILE: /kernl-data/.kernel-auth-token
      # The dashboard's published port: its nginx proxies /api to the kernel.
      KERNL_API: http://127.0.0.1:3086
    volumes:
      - kernel-data:/kernl-data:ro
      - ./services/claude-login-relay/relay.ts:/relay/relay.ts:ro
    command: ["bun", "/relay/relay.ts"]
