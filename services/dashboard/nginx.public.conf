# Public eval stack nginx config.
#
# Same as nginx.conf, except `/mtw` resolves its upstream LAZILY.
#
# mtw-request is opt-in here (compose profile `torrents`), so it is usually
# absent — and a `proxy_pass` naming an unresolvable host makes nginx refuse
# to start, which is why this block used to be omitted entirely. Naming the
# upstream through a variable moves resolution to request time via Docker's
# embedded DNS, so nginx boots either way: with the engine running /mtw
# upgrades normally, without it the request 502s and the dashboard falls back
# to polling on its own (see MAX_COLD_ATTEMPTS in src/lib/ws.ts).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No Access-Control-Allow-Origin here. The SPA and the API it calls are
    # served from this same origin, so CORS is never needed for normal use —
    # and a wildcard would hand every page the user has open the right to read
    # the kernel's API responses. Cross-origin callers are opt-in, per-origin,
    # via the kernel's own CORS_ALLOWED_ORIGINS.
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: ws: wss:; worker-src 'self' blob:; img-src * data: blob:;" always;

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Long-running subtitle work (transcribe/translate) + its SSE progress
    # channel — generous timeout, and no buffering so progress events reach
    # the browser as they happen.
    #
    # `/api/cinema/media/…` is where these live now. The pattern used to match
    # only the historic `/api/torrents/…` spelling, so after the move every
    # one of these fell through to the general `/api/` block below: SSE
    # progress was buffered (the bar sat at 0% for the whole run) and the
    # translate request itself was cut at that block's 120s read timeout,
    # while the kernel kept translating for another four minutes. From the
    # browser it looked exactly like a hang. Both spellings are matched so
    # the old paths keep working.
    # `transcode` and `webseed-proxy` belong here for a different reason than
    # the subtitle routes: they are live media streams. Left in the generic
    # /api/ block they got its 120s read timeout AND its buffering — and a
    # fragmented-MP4 transcode of a source that arrives slower than its own
    # bitrate (archive.org runs ~200 KB/s against a 2291 kb/s film) goes more
    # than 120s between keyframe fragments as a matter of course. nginx cut
    # the stream with `upstream timed out (110)` and the player sat on
    # "converting for your browser" until it died. Buffering to a temp file
    # made it worse: nginx held bytes back that the <video> element needed to
    # start playing.
    location ~ ^/api/(torrents|cinema/media)/(transcribe|transcode|translate-srt|subs|webseed-proxy) {
        proxy_pass http://kernel:3087$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE needs HTTP/1.1 with keep-alive; nginx defaults the upstream leg
        # to 1.0, which cannot stream a chunked response.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        proxy_cache off;
        # Belt and braces for the SSE leg: the kernel already sends
        # X-Accel-Buffering, this makes the intent explicit at the proxy.
        chunked_transfer_encoding on;
    }

    # Streaming LLM endpoint — force HTTP/1.1 + no buffering for chunked output.
    location ~ ^/api/llm/chain/test$ {
        proxy_pass http://kernel:3087$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
    }

    # Peering probes may build a Tor circuit to a friend's onion, which on a
    # cold daemon has been measured at ~46s and can exceed the 120s the general
    # /api/ block allows. Given its own window so a slow-but-working friend is
    # not reported as unreachable by the proxy.
    location /api/peering/ {
        proxy_pass http://kernel:3087$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Proxy API requests to kernel backend
    location /api/ {
        proxy_pass http://kernel:3087/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Instance peering descriptor. Public and signed on purpose: it is how
    # another Kernl learns this instance's identity and how to reach it.
    # Without this the descriptor is only readable over the onion address.
    location /.well-known/ {
        proxy_pass http://kernel:3087$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Extension frontend page bundles (served by the kernel from each
    # active extension's frontend/ dir). $request_uri preserves the raw
    # path + query string (?v= cache-buster).
    location /ext-assets/ {
        proxy_pass http://kernel:3087$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Google OAuth redirect target
    location = /auth/google/callback {
        proxy_pass http://kernel:3087/auth/google/callback$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy MCP requests to kernel backend
    location /mcp {
        proxy_pass http://kernel:3087/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header mcp-session-id $http_mcp_session_id;
    }

    # Kernel-mounted WebSocket gateways (e.g. /ws/irc). HTTP/1.1 + Upgrade
    # headers are required or the WebSocket handshake never completes.
    location /ws/ {
        proxy_pass http://kernel:3087$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # mtwRequest realtime bridge. See the note at the top of this file for why
    # the upstream goes through a variable instead of being named directly.
    location /mtw {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mtw_upstream mtw-request:7741;
        proxy_pass http://$mtw_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }
}
