# Public eval stack nginx config.
#
# Same as nginx.conf but WITHOUT the `/mtw` WebSocket block: the public stack
# (docker-compose.yml) does not run the mtw-request Rust server, and a
# `proxy_pass` to an unresolvable upstream makes nginx fail to start. Live
# WebSocket updates are unavailable in the eval stack; everything served over
# /api and /mcp (the kernel) works normally.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No Access-Control-Allow-Origin here. The SPA and the API it calls are
    # served from this same origin, so CORS is never needed for normal use —
    # and a wildcard would hand every page the user has open the right to read
    # the kernel's API responses. Cross-origin callers are opt-in, per-origin,
    # via the kernel's own CORS_ALLOWED_ORIGINS.
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: ws: wss:; worker-src 'self' blob:; img-src * data: blob:;" always;

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Long-running subtitle work (transcribe/translate) — generous timeout.
    location ~ ^/api/torrents/(transcribe|translate-srt|subs) {
        proxy_pass http://kernel:3087$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    # Streaming LLM endpoint — force HTTP/1.1 + no buffering for chunked output.
    location ~ ^/api/llm/chain/test$ {
        proxy_pass http://kernel:3087$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
    }

    # Peering probes may build a Tor circuit to a friend's onion, which on a
    # cold daemon has been measured at ~46s and can exceed the 120s the general
    # /api/ block allows. Given its own window so a slow-but-working friend is
    # not reported as unreachable by the proxy.
    location /api/peering/ {
        proxy_pass http://kernel:3087$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Proxy API requests to kernel backend
    location /api/ {
        proxy_pass http://kernel:3087/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Instance peering descriptor. Public and signed on purpose: it is how
    # another Kernl learns this instance's identity and how to reach it.
    # Without this the descriptor is only readable over the onion address.
    location /.well-known/ {
        proxy_pass http://kernel:3087$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Extension frontend page bundles (served by the kernel from each
    # active extension's frontend/ dir). $request_uri preserves the raw
    # path + query string (?v= cache-buster).
    location /ext-assets/ {
        proxy_pass http://kernel:3087$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Google OAuth redirect target
    location = /auth/google/callback {
        proxy_pass http://kernel:3087/auth/google/callback$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy MCP requests to kernel backend
    location /mcp {
        proxy_pass http://kernel:3087/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header mcp-session-id $http_mcp_session_id;
    }

    # Kernel-mounted WebSocket gateways (e.g. /ws/irc). HTTP/1.1 + Upgrade
    # headers are required or the WebSocket handshake never completes.
    location /ws/ {
        proxy_pass http://kernel:3087$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }
}
