server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # CSP permissive enough for Three.js shader compilation
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: ws: wss:; worker-src 'self' blob:; img-src * data: blob:;" always;

    # CORS for fonts only (helps WebKitGTK ephemeral sessions). Deliberately
    # scoped to font files instead of the whole server: a server-level wildcard
    # also lands on /api and /mcp, and there it lets any page the user has open
    # read — and on an unauthenticated deployment write — the entire kernel
    # cross-origin. nginx drops inherited add_headers inside a location, so the
    # CSP and cache headers are repeated here on purpose.
    location ~* \.(woff2?|ttf|otf|eot)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: ws: wss:; worker-src 'self' blob:; img-src * data: blob:;" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # HTML files should never be cached
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache immutable assets aggressively (hashed filenames)
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Long-running subtitle work — whisper transcribe can take 5-15 min on
    # CPU and translate-srt can take 5-10 min for a feature-length film.
    # 30 min ceiling so the kernel finishes and writes to cache; subsequent
    # cache-hits are instant. MUST come before the generic /api/ block.
    #
    # These live under `/api/cinema/media/…` now. Matching only the historic
    # `/api/torrents/…` spelling sent them to the generic `/api/` block, which
    # buffers and times out at 120s — the SSE progress bar never moved and the
    # translate request died two minutes in while the kernel worked on. Both
    # spellings are matched so the old paths keep working.
    location ~ ^/api/(torrents|cinema/media)/(transcribe|translate-srt|subs) {
        proxy_pass http://kernel:3087$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE needs HTTP/1.1 keep-alive on the upstream leg; the 1.0 default
        # cannot carry a chunked response.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Streaming LLM endpoints — chain test streams NDJSON (one event per
    # link as it resolves) and SSE-style endpoints write line by line.
    # Default proxy_http_version 1.0 does NOT support Transfer-Encoding:
    # chunked, so the kernel's chunked response gets rejected as malformed
    # and nginx returns 502. Force HTTP/1.1 + disable buffering so events
    # reach the browser in real time.
    location ~ ^/api/llm/chain/test$ {
        proxy_pass http://kernel:3087$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        # 90s so claude-code SDK probes (45s timeout, cold start can hit 30s+)
        # have headroom even when they're the slowest link in the parallel batch.
        proxy_read_timeout 90s;
    }

    # Proxy API requests to kernel backend
    location /api/ {
        proxy_pass http://kernel:3087/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Extension frontend page bundles (served by the kernel from each
    # active extension's frontend/ dir). $request_uri preserves the raw
    # path + query string (?v= cache-buster).
    location /ext-assets/ {
        proxy_pass http://kernel:3087$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Google OAuth redirect target — Google calls this directly with `?code=`.
    # The kernel exchanges the code for tokens and 302-redirects back to `/`.
    # Without this proxy the SPA fallback below would serve index.html (200),
    # then SvelteKit's client-side router would render its 404 page.
    location = /auth/google/callback {
        proxy_pass http://kernel:3087/auth/google/callback$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy MCP requests to kernel backend
    location /mcp {
        proxy_pass http://kernel:3087/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header mcp-session-id $http_mcp_session_id;
    }

    # Proxy WebSocket via mtwRequest (Rust, primary real-time transport)
    location /mtw {
        proxy_pass http://mtw-request:7741/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Proxy kernel-mounted WebSocket gateways (e.g. /ws/irc from the IRC
    # extension, /ws/cameras, /ws/chat) straight to the kernel's shared HTTP
    # server. Needs HTTP/1.1 + Upgrade headers or the handshake never completes.
    location /ws/ {
        proxy_pass http://kernel:3087$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

}
